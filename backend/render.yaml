services:
  - type: web
    name: lightless-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lightless.local
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_PATH
        value: /tmp/lightless.db
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: moonshot-v1-32k